 let html=`<h2>${esc(k)}</h2>${isE?`<span class="tag" style="border-color:${ENT[k].accent};color:${ENT[k].accent}">已建 Dashboard：<a href="${ENT[k].file}" target="_blank">${esc(ENT[k].file)}</a></span>`:''}<span class="tag">被 ${ents.length} 個實體列為交易對手</span><span class="tag">${asCp.length} 筆關係</span>`;
 html+=`<div class="imp"><b>⚠️ 若「${esc(k)}」出事（違約、斷供、監管、估值重挫）</b><br>
 直接受影響：${ents.map(e=>`<b style="color:${ENT[e].accent}">${esc(e)}</b>`).join('、')||'—'}<br>
 ${out.length?`・<b>${out.length}</b> 筆為實體對它的出資／採購／承諾（流出），可能面臨減損或斷供<br>`:''}
 ${inn.length?`・<b>${inn.length}</b> 筆為它投入實體的資金（流入），可能出現資金撤出或股東結構變動<br>`:''}
 已揭露金額（依口徑，不跨口徑相加）：${Object.entries(tot).map(([t,v])=>`${AMT[t]} ${fmtB(v)}`).join('｜')||'皆未揭露'}<br>
 證據強度：最高 ${best!=='—'?gb(best):'—'}${rumor?`，其中 ${rumor} 筆為傳聞／未定案`:''}</div>`;
 html+=asCp.map(l=>`<div class="rel${l.rumor?' rumor':''}" style="--c:${ENT[l.ent].accent}"><div class="h"><b>${esc(l.ent)}</b><span>${gb(l.grade)} <span class="at${IN.has(l.amtType)||l.dir==='in'?' in':''}">${l.dir==='in'?'↙流入':'↗流出'}・${AMT[l.amtType]}</span></span></div>
 <div>${esc(l.name)}｜${esc(l.cat)}｜${esc(l.type)}</div><div><b>${esc(l.short||'—')}</b>　<span class="hint">${esc(l.date)}・${esc(l.status)}</span></div>
 <div class="hint">${l.src.map(s=>`<a href="${s[1]}" target="_blank">${esc(String(s[0]).split('｜')[0])}</a>`).join('　')}　→ <a href="${ENT[l.ent].file}" target="_blank">開啟 ${esc(l.ent)} Dashboard</a></div></div>`).join('');
 if(isE){const own=DATA.links.filter(l=>l.ent===k&&HUB[l.cp]&&HUB[l.cp].deg>=2&&l.cp!==k);
  if(own.length) html+=`<h2 style="margin-top:14px;font-size:15px">${esc(k)} 自身與其他樞紐的關係</h2>`+own.map(l=>`<div class="hint">→ ${esc(l.cp)}：${esc(l.name)}｜${AMT[l.amtType]} ${esc(l.short||'')}</div>`).join('');}
 S.innerHTML=html;
}
/* ---------- 排行表 ---------- */
let sortK='deg',sortD=-1;
function table(){
 const rows=TOPH.map(h=>{const ls=DATA.links.filter(l=>l.cp===h.key);const g=['A','B','C','D'].map(x=>ls.filter(l=>l.grade===x).length);
  return {k:h.key,deg:h.deg,links:h.links,ents:h.ents.join('、'),tot:Object.entries(h.tot).map(([t,v])=>`${AMT[t]} ${fmtB(v)}`).join('｜')||'未揭露',g,rumor:ls.filter(l=>l.rumor).length,roles:[...new Set(ls.map(l=>l.type))].slice(0,4).join('；')}});
 rows.sort((a,b)=>{const x=a[sortK],y=b[sortK];return (x>y?1:x<y?-1:0)*sortD});
 const C=[['k','交易對手'],['deg','涉及實體數'],['links','關係筆數'],['ents','涉及實體'],['tot','已揭露金額（依口徑）'],['roles','主要交易型態'],['g','來源可信度 A/B/C/D'],['rumor','傳聞／未定案']];
 $('#tbl thead').innerHTML='<tr>'+C.map(([k,l])=>`<th data-k="${k}">${l}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
 $('#tbl tbody').innerHTML=rows.map(r=>`<tr><td><a href="#" data-k="${esc(r.k)}"><b>${esc(r.k)}</b></a></td><td>${r.deg}</td><td>${r.links}</td><td>${esc(r.ents)}</td><td>${esc(r.tot)}</td><td>${esc(r.roles)}</td><td>${r.g.map((n,i)=>n?gb('ABCD'[i])+' '+n:'').join(' ')}</td><td>${r.rumor||''}</td></tr>`).join('');
 document.querySelectorAll('#tbl th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:-1;sortK=k;table()});
 document.querySelectorAll('#tbl a[data-k]').forEach(a=>a.onclick=ev=>{ev.preventDefault();selected=a.dataset.k;if(!NODES.find(n=>n.id===selected)){$('#minDeg').value='1';build();}draw();side(selected);window.scrollTo({top:0,behavior:'smooth'})});
 window._rows=rows;
}
$('#csv').onclick=()=>{const rows=window._rows||[];const head=['交易對手','涉及實體數','關係筆數','涉及實體','已揭露金額（依口徑）','主要交易型態','A','B','C','D','傳聞／未定案'];
 const csv=[head,...rows.map(r=>[r.k,r.deg,r.links,r.ents,r.tot,r.roles,...r.g,r.rumor])].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([''+csv],{type:'text/csv'}));a.download=`生態系樞紐排行_${DATA.asOf}.csv`;a.click();};
/* CSV 開頭的 BOM 由下一行補上，避免 Excel 中文亂碼 */
(function(){const B=window.Blob;window.Blob=function(parts,opt){if(opt&&opt.type==='text/csv')parts=[String.fromCharCode(65279),...parts.map(p=>typeof p==='string'?p.replace(/^/,''):p)];return new B(parts,opt)};})();
$('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='light'?'':'light';draw()};
['#minDeg','#dirSel','#cpChk'].forEach(s=>$(s).onchange=()=>{build();side(selected)});
$('#q').oninput=draw; $('#reset').onclick=()=>{selected=null;$('#q').value='';$('#minDeg').value='2';$('#dirSel').value='';$('#cpChk').checked=true;build();side(null)};
$('#foot').innerHTML=`<b>方法與注意事項：</b>（1）由各實體 Dashboard 的 data.json 自動彙整；同一交易對手以名稱與代號別名合併（例如 Google／Alphabet、台積電／TSMC），可能仍有少數未合併或誤合併。（2）「涉及實體數」含該對手本身若也是已建 Dashboard 的實體。（3）金額依口徑（股權成本、承諾上限、合約價值、流入資金等）分開加總，不跨口徑相加；未揭露金額不計。（4）可信度：A 公司公告／監管申報、B 主流財經媒體、C 其他媒體或彙整、D 傳聞或推估。（5）「若出事」為暴露範圍估計，不代表實際損失。（6）本頁為資訊整理，非投資建議。<br>已納入：${DATA.ents.map(e=>`<a href="${e.file}" target="_blank">${esc(e.entity)}</a>`).join('、')}`;
(function(){const C=DATA.checks||[];const col={'待確認':'#f87171','單邊':'#fb923c','已說明':'#facc15','一致':'#4ade80'};
 const cell=i=>`<b style="color:${(ENT[i.ent]||{}).accent||'inherit'}">${esc(i.ent)}</b>｜${esc(i.name)}<br>${esc(i.short)}${i.amtType==='none'&&!i.date?'':`（${AMT[i.amtType]||''}${i.date?'，'+esc(i.date):''}）`}${i.val!=null?`<br><span class="hint">現值 ${fmtB(i.val)}${i.valDate?'（'+esc(i.valDate)+'）':''}</span>`:''}${i.xnote?`<br><span class="hint">說明：${esc(i.xnote)}</span>`:''}`;
 $('#chk').innerHTML=C.length?`<thead><tr><th>結果</th><th>類型</th><th>對象</th><th>甲方記載</th><th>乙方記載</th></tr></thead><tbody>`+C.map(c=>`<tr><td><b style="color:${col[c.status]}">${c.status}</b></td><td>${c.kind}${(c.flags||[]).map(f=>`<br><span class="hint">${esc(f)}</span>`).join('')}</td><td>${esc(c.cp)}</td><td>${cell(c.items[0])}</td><td>${c.items.slice(1).map(cell).join('<hr style="border:none;border-top:1px dashed var(--line)">')}</td></tr>`).join('')+`</tbody>`:'<tr><td class="hint">目前沒有可比對的重複關係。</td></tr>';
})();
(function(){const C=DATA.cycles||[];const nm=k=>`<b style="color:${(ENT[k]||{}).accent||'inherit'}">${esc(k)}</b>`;
 $('#cyc').innerHTML=C.length?`<thead><tr><th>環節</th><th>資金路徑（箭頭為資金方向）</th><th>最小的一段</th><th>備註</th></tr></thead><tbody>`+C.map(c=>`<tr><td>${c.len}</td><td>${c.edges.map((e,i)=>`${nm(e.from)} <span class="hint">─ ${i===c.minIdx?'<u>':''}${e.amt==null?esc(e.type||'供應／採購')+'（金額未揭露）':esc(e.short)+'（'+(AMT[e.amtType]||'')+(e.per?'・每年':'')+'）'}${i===c.minIdx?'</u>':''} →</span> `).join('')}${nm(c.path[0])}</td><td class="mono">${fmtB(c.min)}</td><td class="hint">${c.rumor?'含傳聞或未定案的一段；':''}${c.und?'有一段金額未揭露；':''}${c.edges.some(e=>e.per)?'含年度金額；':''}各段口徑不同，不可相加</td></tr>`).join('')+`</tbody>`:'<tr><td class="hint">目前沒有偵測到閉環。</td></tr>';
})();
const RISK={reg:'監管',geo:'地緣／出口管制',conc:'客戶集中',acct:'會計',exec:'執行／未定案',fin:'財務／擔保'};
let cmpSel=['Meta','Google／Alphabet','Intel'].filter(k=>DATA.ents.some(e=>e.key===k)); if(cmpSel.length<2) cmpSel=DATA.ents.slice(0,3).map(e=>e.key);
function cmp(){
 $('#cmpPick').innerHTML=DATA.ents.map(e=>`<label style="margin-right:8px"><input type="checkbox" value="${esc(e.key)}" ${cmpSel.includes(e.key)?'checked':''}> <b style="color:${e.accent}">${esc(e.entity)}</b></label>`).join('')+'<span class="hint">最多 3 家；金額只在同口徑內比較</span>';
 $('#cmpPick').querySelectorAll('input').forEach(i=>i.onchange=()=>{if(i.checked){cmpSel.push(i.value);if(cmpSel.length>3)cmpSel.shift();}else cmpSel=cmpSel.filter(x=>x!==i.value);cmp();});
 const E=cmpSel.map(k=>ENT[k]).filter(Boolean); if(!E.length){$('#cmp').innerHTML='';return;}
 const types=Object.keys(AMT).filter(t=>E.some(e=>e.st.tot[t]));
 const bar=(v,max,c)=>v?`<div style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;height:8px;width:${Math.max(3,v/max*140)}px;background:${c};border-radius:3px"></span>${fmtB(v)}</div>`:'—';
 const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
 const R=[];
 types.forEach(t=>{const mx=Math.max(...E.map(e=>e.st.tot[t]||0));R.push([`${IN.has(t)?'↙':'↗'}${AMT[t]}`,E.map(e=>bar(e.st.tot[t]||0,mx,e.accent))]);});
 const own=e=>Object.values(e.st.grade).reduce((a,b)=>a+b,0);
 R.push(['節點數（不含對手方）',E.map(e=>own(e))]);
 R.push(['循環對手方節點',E.map(e=>e.st.cpNodes)]);
 R.push(['跨實體共同樞紐',E.map(e=>e.st.hubs)]);
 R.push(['A／B 級來源占比',E.map(e=>pct(e.st.grade.A+e.st.grade.B,own(e)))]);
 R.push(['傳聞／未定案節點',E.map(e=>e.st.rumor)]);
 R.push(['未重新查證節點',E.map(e=>e.st.stale)]);
 Object.keys(RISK).filter(k=>E.some(e=>e.st.risk[k])).forEach(k=>R.push([`⚑ ${RISK[k]}`,E.map(e=>e.st.risk[k]||'—')]));
 R.push(['資金循環（已量化回流）',E.map(e=>`${e.st.loops}（${e.st.loopsQ}）`)]);
 R.push(['已填現值的節點',E.map(e=>e.st.val)]);
 R.push(['金額最大的 3 個節點',E.map(e=>e.st.top.map(x=>`${esc(x[0])}　${esc(x[1])}<span class="hint">（${x[2]}）</span>`).join('<br>'))]);
 $('#cmp').innerHTML=`<thead><tr><th>項目</th>${E.map(e=>`<th><a href="${e.file}" target="_blank" style="color:${e.accent}">${esc(e.entity)}</a> <span class="hint">${e.asOf}</span></th>`).join('')}</tr></thead><tbody>${R.map(([l,v])=>`<tr><td>${l}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
build(); side(null); table(); cmp();
</script>
</body>
