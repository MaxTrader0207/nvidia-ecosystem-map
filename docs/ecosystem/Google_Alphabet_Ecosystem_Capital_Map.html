<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生態資本投資循環架構｜投資族譜 Dashboard</title>
<style>
:root{
--bg:#0a0e13; --panel:#11171f; --panel2:#161e28; --line:#243041; --text:#e6edf3; --muted:#8b9bb0;
--nv:#76b900; --lab:#a78bfa; --cloud:#38bdf8; --supply:#fb923c; --semi:#f472b6; --mna:#2dd4bf; --fin:#facc15; --other:#94a3b8; --cp:#64748b;
--warn:#f87171; --fs:1;
--node:#0d131b; --rootbg:#0f1a06; --line2:#1c2633; --hover:#0f151d;
--gov-bg:#1a160b; --gov-bd:#3b2f12; --ok-bg:#0c1510; --ok-bd:#1e3a2a; --edge-t:#d9f99d; --chord-t:#fecaca;
}
[data-theme="graphite"]{--bg:#18181b;--panel:#222226;--panel2:#2a2a2f;--line:#3a3a42;--text:#f4f4f5;--muted:#a1a1aa;--node:#1f1f23;--rootbg:#1a2410;--line2:#33333a;--hover:#26262b}
[data-theme="navy"]{--bg:#0b1628;--panel:#10203a;--panel2:#152a4a;--line:#24406a;--text:#e8f0ff;--muted:#93a8c8;--node:#0e1c33;--rootbg:#10240f;--line2:#1d3456;--hover:#12243f}
[data-theme="black"]{--bg:#000;--panel:#0a0a0a;--panel2:#121212;--line:#262626;--text:#fafafa;--muted:#a3a3a3;--node:#050505;--rootbg:#0a1400;--line2:#1a1a1a;--hover:#111}
[data-theme="light"]{--bg:#f5f7fa;--panel:#ffffff;--panel2:#eef2f6;--line:#d5dde7;--text:#111827;--muted:#5b6b80;--node:#ffffff;--rootbg:#eef8dc;--line2:#e2e8f0;--hover:#f0f4f8;--gov-bg:#fff8e1;--gov-bd:#f3d48a;--ok-bg:#eefbea;--ok-bd:#b6e2a8;--edge-t:#3f6212;--chord-t:#b91c1c}
[data-theme="light"] .lcard .la,[data-theme="light"] .ccard .cn,[data-theme="light"] .gov b{filter:brightness(.72) saturate(1.4)}
[data-theme="light"] a{color:#0369a1}
.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.settings .lbl{color:var(--muted);font-size:calc(12px*var(--fs))}
.settings input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.fsval{min-width:44px;text-align:center;font-family:Consolas,monospace;font-size:calc(12.5px*var(--fs))}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.xwrap{position:relative;display:inline-block}
.xbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:calc(12px*var(--fs));font-family:inherit;white-space:nowrap}
.xbtn:hover{border-color:var(--nv)}
.xmenu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:190px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.xmenu.on{display:block}
.xmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:calc(12.5px*var(--fs))}
.xmenu button:hover{background:var(--panel2)}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:calc(12px*var(--fs))}
.shead{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;color:var(--muted);font-size:calc(12.5px*var(--fs))}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--nv);color:var(--text);padding:8px 14px;border-radius:8px;font-size:calc(13px*var(--fs));z-index:99;display:none}
@media print{
body.printing *{visibility:hidden}
body.printing .print-target,body.printing .print-target *{visibility:visible}
body.printing .print-target{position:absolute!important;left:0;top:0;width:100%;max-height:none!important;overflow:visible!important}
.xwrap,.settings{display:none!important}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:calc(14px*var(--fs))}
a{color:#7dd3fc;text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
header{padding:16px 22px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
header h1{margin:0;font-size:calc(20px*var(--fs));letter-spacing:.5px}
header h1 b{color:var(--nv)}
header .sub{color:var(--muted);font-size:calc(12px*var(--fs));margin-top:4px}
.gov{position:relative;margin:10px 22px 0;padding:9px 14px;border:1px solid var(--gov-bd);background:var(--gov-bg);border-radius:8px;font-size:calc(12.5px*var(--fs));line-height:1.6}
.gov b{color:var(--fin)}
.gov .gh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.gov .gh b{font-size:calc(13.5px*var(--fs))}
.gov .gh .rng{color:var(--muted);font-size:calc(11.5px*var(--fs))}
.gov .gf{display:inline-flex;gap:4px;margin-left:auto;margin-right:8px}
.gov .gf button{background:none;border:1px solid var(--gov-bd);color:var(--muted);border-radius:999px;padding:1px 9px;cursor:pointer;font-family:inherit;font-size:calc(11.5px*var(--fs))}
.gov .gf button.on{color:var(--text);border-color:var(--fin)}
.gov .glead{margin:0 0 6px;padding-bottom:6px;border-bottom:1px dashed var(--gov-bd)}
.gov ul.gl{list-style:none;margin:0;padding:0}
.gov ul.gl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--gov-bd)}
.gov ul.gl li:first-child{border-top:none}
.gov ul.gl .gd{font-family:Consolas,monospace;color:var(--muted);font-size:calc(12px*var(--fs))}
.gov ul.gl .gd small{display:block;font-size:calc(10.5px*var(--fs))}
.gov ul.gl .gt{font-weight:600}
.gov ul.gl .gx{color:var(--muted);font-size:calc(12px*var(--fs))}
.gov ul.gl .gtag{display:inline-block;font-size:calc(10.5px*var(--fs));padding:0 6px;border-radius:4px;margin-right:6px;border:1px solid var(--c);color:var(--c)}
.gov ul.gl .gs a{font-size:calc(11px*var(--fs));margin-right:6px}
.gov .gmore{margin-top:4px;background:none;border:none;color:var(--fin);cursor:pointer;font-family:inherit;font-size:calc(12px*var(--fs));padding:2px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px 22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative}
.kpi .v{font-size:calc(21px*var(--fs));font-weight:700;color:var(--nv)}
.kpi .l{color:var(--muted);font-size:calc(12px*var(--fs));margin-top:2px}
.kpi .s{position:absolute;top:8px;right:10px;font-size:calc(11px*var(--fs))}
nav.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;font-size:calc(14px*var(--fs));border-bottom:2px solid transparent;font-family:inherit}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--nv)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 22px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:4px 10px;font-size:calc(12px*var(--fs));cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.off{opacity:.35}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:calc(13px*var(--fs))}
input[type=search]{width:200px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:calc(12.5px*var(--fs));font-family:inherit}
.btn:hover{border-color:var(--nv)}
label.tg{font-size:calc(12.5px*var(--fs));color:var(--muted);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.view{display:none} .view.on{display:block}
.graphwrap{display:grid;grid-template-columns:1fr 370px;gap:0;border-top:1px solid var(--line);align-items:start}
.ftree{position:relative;display:grid;grid-template-columns:150px 1fr;gap:0 56px;padding:18px 22px 30px}
.froot{align-self:center;position:relative;z-index:2;border:2px solid var(--nv);background:var(--rootbg);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer}
.froot b{display:block;color:var(--nv);font-size:calc(22px*var(--fs));font-weight:800}
.froot span{color:#a3c46b;font-size:calc(11.5px*var(--fs))}
.rows{display:flex;flex-direction:column;gap:16px;position:relative;z-index:2}
.crow{display:grid;grid-template-columns:190px 1fr;gap:0 44px;align-items:center}
.ccard{border:1.5px solid var(--c);border-radius:10px;padding:9px 11px;background:var(--node)}
.ccard .cn{color:var(--c);font-weight:700;font-size:calc(13.5px*var(--fs))}
.ccard .cs{color:var(--muted);font-size:calc(11.5px*var(--fs));margin-top:3px;line-height:1.5}
.leafgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lcard{position:relative;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 9px 8px;background:var(--panel);cursor:pointer;transition:border-color .12s}
.lcard:hover{border-color:var(--c)}
.lcard .ln{font-weight:600;font-size:calc(13px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .ln small{color:var(--muted);font-weight:400;font-family:Consolas,monospace;font-size:calc(11px*var(--fs));margin-left:5px}
.lcard .la{color:var(--c);font-family:Consolas,monospace;font-size:calc(13px*var(--fs));font-weight:700;margin-top:2px}
.lcard .lm{color:var(--muted);font-size:calc(11px*var(--fs));margin-top:1px}
.lcard .bar{height:3px;background:var(--line2);border-radius:2px;margin-top:6px}
.lcard .bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.lcard .flag{position:absolute;top:6px;right:7px;font-size:calc(10px*var(--fs));padding:0 5px;border-radius:4px;border:1px solid #f87171;color:#fca5a5}
.lcard.sel{box-shadow:0 0 0 2px var(--c);border-color:var(--c)}
.lcard.rel{box-shadow:0 0 0 1px #e2e8f0}
.lcard.rel::after{content:"循環關聯";position:absolute;bottom:6px;right:7px;font-size:calc(10px*var(--fs));color:#e2e8f0;background:#334155;padding:0 5px;border-radius:4px}
.lcard.dim{opacity:.22}
.lcard .badges{position:absolute;top:6px;right:7px;display:flex;gap:3px}
.lcard .badges .flag{position:static}
.gb{display:inline-block;min-width:15px;text-align:center;font-size:calc(10px*var(--fs));font-weight:700;padding:0 4px;border-radius:4px;color:#0a0e13;font-family:Consolas,monospace}
.gA{background:#4ade80}.gB{background:#38bdf8}.gC{background:#fbbf24}.gD{background:#f87171}
.at{display:inline-block;font-size:calc(10px*var(--fs));padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
.at.in{border-color:#4ade80;color:#86efac}
.lcard.rumor{border-style:dashed;opacity:.72}
.lcard .ln{padding-right:22px}
.lcard.hasflag .ln{padding-right:60px}
.lcard.rumor .la{text-decoration:underline dotted}
.lcard.stale{filter:grayscale(.85)}
.lcard .stl{font-size:calc(10px*var(--fs));color:#fbbf24;margin-left:4px}
.amtbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 22px 8px}
.amtbar .ab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:calc(12px*var(--fs))}
.amtbar .ab b{font-family:Consolas,monospace;color:var(--text);margin-left:6px}
.amtbar .ab.on{border-color:var(--nv);box-shadow:0 0 0 1px var(--nv) inset}
.amtbar .ab.in b{color:#86efac}
.amtbar .lg{color:var(--muted);font-size:calc(11.5px*var(--fs));margin-left:auto}
.freshw{color:#fbbf24}
.rk{display:inline-block;font-size:calc(10px*var(--fs));padding:0 4px;border-radius:4px;border:1px solid #f97316;color:#fdba74;margin:0 3px 2px 0}
.lcard .rks{margin-top:3px;line-height:1.3}
.pos{display:inline-block;font-size:calc(10px*var(--fs));padding:0 5px;border-radius:4px;background:#1d4ed8;color:#fff;margin:0 4px 2px 0}
.moic{font-size:calc(11px*var(--fs));color:var(--muted);margin-left:6px;font-weight:400}
.ic{margin:10px 22px 0;padding:10px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:calc(12.5px*var(--fs));line-height:1.65}
.ic .ich{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ic .ich b{font-size:calc(14px*var(--fs))}
.ic .ich .xslot{margin-left:auto}
.ic .thesis{margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--nv);background:var(--panel2);border-radius:4px}
.ic .icg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.ic .icg>div{background:var(--panel2);border-radius:6px;padding:8px 10px}
.ic .icg>div>b{display:block;margin-bottom:4px;color:var(--nv)}
.ic ul{margin:0;padding-left:18px}
.ic .auto{color:var(--muted);font-size:calc(11px*var(--fs));font-weight:400;margin-left:4px}
.diffbar{margin:0 22px 8px;padding:6px 12px;border:1px dashed var(--line);border-radius:8px;font-size:calc(12.5px*var(--fs));color:var(--muted)}
.diffbar summary{cursor:pointer}
.diffbar ul{margin:6px 0 0;padding-left:20px;max-height:260px;overflow:auto}
.diffbar .add{color:#86efac}.diffbar .del{color:#fca5a5}.diffbar .chg{color:#fde68a}
.stress{padding:4px 22px 30px;display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.stress .ctl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stress .ctl label{display:block;margin:12px 0 4px;font-size:calc(12.5px*var(--fs))}
.stress input[type=range]{width:100%}
.stress .rv{float:right;font-family:Consolas,monospace;color:var(--nv)}
.terms{width:100%;font-size:calc(12px*var(--fs))}
.terms td{padding:2px 6px;border-bottom:1px solid var(--line2)}
@media (max-width:1000px){.stress{grid-template-columns:1fr}}
svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
aside#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;position:sticky;top:0;max-height:100vh}
aside h2{margin:0 0 4px;font-size:calc(18px*var(--fs))}
.tag{display:inline-block;font-size:calc(11px*var(--fs));padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--muted)}
.kv{margin:10px 0;font-size:calc(13px*var(--fs));line-height:1.65}
.kv dt{color:var(--muted);font-size:calc(11.5px*var(--fs));margin-top:8px}
.kv dd{margin:2px 0 0}
.srcs{margin:8px 0 0;padding-left:18px;font-size:calc(12.5px*var(--fs));line-height:1.6}
.hint{color:var(--muted);font-size:calc(12.5px*var(--fs));line-height:1.7}
.tooltip{position:fixed;pointer-events:none;background:#0d131b;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:calc(12px*var(--fs));display:none;z-index:50;max-width:280px}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:calc(11.5px*var(--fs));color:var(--muted)}
/* flow */
.flowwrap{display:grid;grid-template-columns:260px 1fr 340px;min-height:calc(100vh - 120px);border-top:1px solid var(--line)}
.looplist{border-right:1px solid var(--line);padding:12px;background:var(--panel)}
.looplist button{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:calc(13px*var(--fs));line-height:1.45}
.looplist button.on{border-color:var(--nv);box-shadow:0 0 0 1px var(--nv) inset}
.looplist small{color:var(--muted);display:block;font-size:calc(11.5px*var(--fs))}
#flow{width:100%;height:calc(100vh - 120px);min-height:620px}
.loopinfo{border-left:1px solid var(--line);padding:14px;background:var(--panel);overflow:auto}
/* table */
.tablewrap{padding:0 22px 30px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:calc(12.5px*var(--fs))}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);cursor:pointer;white-space:nowrap;font-weight:600}
th:hover{color:var(--nv)}
td.amt{font-family:"JetBrains Mono",Consolas,monospace;white-space:nowrap;text-align:right}
td .srcmini a{display:inline-block;margin-right:6px;font-size:calc(11.5px*var(--fs))}
tr:hover td{background:var(--hover)}
/* timeline */
.tl{padding:10px 22px 40px;max-width:1100px}
.tl .yr{font-size:calc(16px*var(--fs));color:var(--nv);margin:18px 0 6px;font-weight:700}
.ev{display:grid;grid-template-columns:110px 14px 1fr;gap:10px;align-items:start;padding:6px 0}
.ev .d{color:var(--muted);font-family:Consolas,monospace;font-size:calc(12.5px*var(--fs));text-align:right;padding-top:1px}
.ev .dot{width:11px;height:11px;border-radius:50%;margin-top:4px}
.ev .t{font-weight:600}
.ev .x{color:var(--muted);font-size:calc(12.5px*var(--fs));line-height:1.6}
footer{padding:16px 22px 30px;color:var(--muted);font-size:calc(11.5px*var(--fs));line-height:1.7;border-top:1px solid var(--line)}
@media (max-width:1000px){.graphwrap,.flowwrap{grid-template-columns:1fr;height:auto}.ftree,.crow{grid-template-columns:1fr;gap:10px}svg.links{display:none}aside#detail{position:static;max-height:none}aside#detail,.loopinfo,.looplist{border:none}}
</style>
</head>
<body>
<header>
<div>
<h1><b id="hEnt"></b> 生態資本投資循環架構 · 投資族譜 Dashboard</h1>
<div class="sub" id="hSub"></div>
</div>
<div class="legend" id="legend"></div>
</header>
<div class="settings">
<span class="lbl">🎨 背景</span>
<select id="themeSel">
<option value="">深夜（預設）</option><option value="graphite">石墨灰</option><option value="navy">深海藍</option><option value="black">純黑</option><option value="light">淺色</option>
</select>
<span class="lbl">自訂</span><input type="color" id="bgPick" value="#0a0e13" title="自訂背景色">
<span class="sep"></span>
<span class="lbl">🔠 字體</span>
<button class="btn" id="fsDown">A−</button><span class="fsval" id="fsVal">100%</span><button class="btn" id="fsUp">A＋</button>
<span class="sep"></span>
<button class="btn" id="prefReset">還原預設</button>
<span style="flex:1"></span>
<span class="xslot" data-x="all"></span>
</div>
<div class="gov" id="gov"><div class="gh"><b id="govT"></b><span class="rng" id="govR"></span><span class="gf" id="govF"></span><span class="xslot" data-x="gov"></span></div><div class="glead" id="govH"></div><ul class="gl" id="govL"></ul><button class="gmore" id="govM"></button></div>
<div class="ic" id="ic"></div>
<div class="shead"><span>📊 關鍵指標</span><span class="xslot" data-x="kpi"></span></div>
<div class="kpis" id="kpis"></div>
<div class="amtbar" id="amtbar"></div>
<div class="diffbar" id="diffbar"></div>
<nav class="tabs">
<button data-v="v-tree" class="on">🌳 投資族譜圖</button>
<button data-v="v-flow">🔁 資金循環架構</button>
<button data-v="v-table">📋 投資明細表</button>
<button data-v="v-tl">🕒 時間軸</button>
<button data-v="v-stress">🧪 壓力測試</button>
</nav>
<section class="view on" id="v-tree">
<div class="toolbar">

function multiText(parent,x,y,str,attrs,lh=15*FS()){
const lines=str.split('\n'); const t=el('text',{x,y:y-(lines.length-1)*lh/2,'text-anchor':'middle','dominant-baseline':'middle',...attrs},parent);
lines.forEach((ln,i)=>{const s=el('tspan',{x,dy:i?lh:0},t);s.textContent=ln});return t;
}
let curLoop=0;
const FS=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1;
function drawLoop(i){
curLoop=i; const L=LOOPS[i]; fsvg.innerHTML='';
const defs=el('defs',{},fsvg);
const mk=(id,col)=>{const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',fill:col},m)};
mk('fa',M.accent);mk('fb','#f87171');
const R=270, n=L.nodes.length, P=L.nodes.map((_,k)=>{const a=-Math.PI/2+k*2*Math.PI/n;return{x:R*Math.cos(a)*1.25,y:R*Math.sin(a),a}});
el('ellipse',{cx:0,cy:0,rx:R*1.25,ry:R,fill:'none',style:'stroke:var(--line2)','stroke-dasharray':'2 8'},fsvg);
const NR=74*Math.max(1,FS());
L.edges.forEach(([a,b,lab,kind],k)=>{
const p=P[a],q=P[b]; const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
const sx=p.x+dx/d*NR, sy=p.y+dy/d*NR, ex=q.x-dx/d*(NR+6), ey=q.y-dy/d*(NR+6);
let path,lx,ly;
if(kind==='chord'){
const mx=(sx+ex)/2, my=(sy+ey)/2; const nx=-dy/d, ny=dx/d; const off=-40;
path=`M${sx},${sy} Q${mx+nx*off},${my+ny*off} ${ex},${ey}`; lx=mx+nx*off*0.6; ly=my+ny*off*0.6;
} else {
const mx=(sx+ex)/2, my=(sy+ey)/2; const len=Math.hypot(mx,my)||1; const bow=70;
const cx=mx+mx/len*bow, cy=my+my/len*bow; path=`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`; lx=mx+mx/len*(bow+38); ly=my+my/len*(bow+30);
}
const col=kind==='chord'?'#f87171':M.accent;
const pe=el('path',{d:path,fill:'none',stroke:col,'stroke-width':kind==='chord'?1.8:2.6,'stroke-dasharray':kind==='chord'?'6 5':'','marker-end':`url(#${kind==='chord'?'fb':'fa'})`,opacity:.9},fsvg);
const anim=el('circle',{r:4,fill:col},fsvg); const am=el('animateMotion',{dur:(3+k*0.4)+'s',repeatCount:'indefinite',path},anim);
const bg=el('g',{},fsvg);
const t=multiText(bg,lx,ly,lab,{style:kind==='chord'?'fill:var(--chord-t)':'fill:var(--edge-t)','font-size':12.5*FS()});
try{const bb=t.getBBox();bg.insertBefore(el('rect',{x:bb.x-6,y:bb.y-4,width:bb.width+12,height:bb.height+8,rx:6,style:'fill:var(--node)',stroke:col,'stroke-opacity':.4}),t)}catch(e){}
});
L.nodes.forEach(([name,col],k)=>{
const p=P[k]; const g=el('g',{},fsvg);
el('circle',{cx:p.x,cy:p.y,r:NR,style:'fill:var(--node)',stroke:col,'stroke-width':3},g);
multiText(g,p.x,p.y,name,{fill:col,'font-size':(name.includes('\n')?11:15)*FS(),'font-weight':700},13.5*FS());
});
$('#loopBody').innerHTML=`<h2>${L.title}</h2><p class="hint" style="color:var(--text)">${esc(L.text)}</p><div class="hint" style="margin:6px 0">${loopQ(L)}${L.backNote?`<br>${esc(L.backNote)}`:''}</div>${L.backSrc&&L.backSrc.length?srcHTML(src(...L.backSrc)):''}<dl class="kv"><dt>資訊來源（${L.src.length}）</dt><dd>${srcHTML(L.src)}</dd></dl>
${DATA.loopNote?`<dl class="kv"><dt>判讀提醒</dt><dd class="hint">${esc(DATA.loopNote.text)}</dd>${DATA.loopNote.src&&DATA.loopNote.src.length?`<dd>${srcHTML(src(...DATA.loopNote.src))}</dd>`:''}</dl>`:''}`;
}

 const fut=[...(DATA.events||[]),...((DATA.notice||{}).items||[])].filter(e=>e.d>asOf).sort((a,b)=>a.d<b.d?-1:1).map(e=>({t:e.t,d:e.d,src:e.src}));

function runStress(){
 const h=+$('#s1').value/100, c=+$('#s2').value/100, f=+$('#s3').value/100;
 ['1','2','3'].forEach(i=>$('#v'+i).textContent=$('#s'+i).value+'%');

 N.filter(n=>!CAT[n.cat].counterparty&&!n.excludeFromSum&&n.amt!=null).forEach(n=>{
  const killed=n.risks.some(r=>hit.has(r.k)); let k=null,b=0,s=0;
  if(['equity','project'].includes(n.amtType)&&n.direction!=='in'){k='hold';b=n.val??n.amt;s=killed?0:b*(1-h);}
  else if(['commitment','contract','capex'].includes(n.amtType)){k='com';b=n.paid!=null?Math.max(0,n.amt-n.paid):n.amt;s=killed?0:b*(1-c);}
  else if(n.amtType==='inflow'){k='inf';b=n.amt;s=killed?0:b*(1-f);}
  if(!k)return; B[k]+=b; Sx[k]+=s; if(b-s>1e-9) imp.push([n,k,b,s,killed]);});
 const lb=LOOPS.filter(l=>l.back!=null), L0=lb.reduce((a,l)=>a+l.back,0), L1=L0*(1-c);

 imp.sort((a,b)=>(b[2]-b[3])-(a[2]-a[3]));

 ${row('未付承諾與合約',B.com,Sx.com,'對手方縮減或取消的金額')}

 </tbody></table>
 <h3 style="margin:16px 0 6px;font-size:calc(14px*var(--fs))">受影響最大的節點</h3>
 <table><thead><tr><th>節點</th><th>口徑</th><th>基準</th><th>情境</th><th>減少</th></tr></thead><tbody>${imp.slice(0,12).map(([n,k,b,s,kd])=>`<tr><td>${esc(n.name)}${kd?' <span class="rk">風險成真</span>':''}</td><td>${LBL[k]}</td><td class="amt">${fmtB(b)}</td><td class="amt">${fmtB(s)}</td><td class="amt" style="color:#f87171">−${fmtB(b-s)}</td></tr>`).join('')||'<tr><td colspan="5" class="hint">調整左側假設即可看到影響</td></tr>'}</tbody></table>`;
 window.stressRows=imp.map(([n,k,b,s])=>[n.name,LBL[k],+b.toFixed(3),+s.toFixed(3)]);}
drawIC(); drawDiff(); initStress();
drawTree(); showCenter(); if(LOOPS.length) drawLoop(0); else document.querySelector('[data-v="v-flow"]').style.display='none'; drawTable(); drawTL();

const tb=sh=>`<h3>${esc(sh.name)}</h3><table border="1"><tr>${sh.head.map(h=>`<th style="background:#e2efda">${esc(h)}</th>`).join('')}</tr>${sh.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table><br>`;
return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>${sheets.map(tb).join('')}</body></html>`;
}
const nodeRow=n=>[n.name,n.tk,CAT[n.cat].name,n.type,n.amt??'',n.short,AMT_TYPES[n.amtType],n.direction==='in'?'流入':'流出',n.val??'',n.moic!=null?n.moic.toFixed(2):'',n.risks.map(r=>RISK_TYPES[r.k]).join('、'),Object.keys(TERM_LBL).filter(k=>n.terms[k]!=null&&n.terms[k]!=='').map(k=>TERM_LBL[k]+'：'+(n.terms[k]===true?'有':n.terms[k]===false?'無':n.terms[k])).join('；'),POS_TYPES[posOf(n)]||'',n.grade,n.verified||'未查證',n.amtText,n.date,n.status,n.flow,n.src.map(x=>`[${x.g}] `+x.t+' '+x.u).join(' ; ')];

/* 列印單一區塊 */
function printBlock(el){
document.body.classList.add('printing');el.classList.add('print-target');
const done=()=>{document.body.classList.remove('printing');el.classList.remove('print-target');window.removeEventListener('afterprint',done)};
window.addEventListener('afterprint',done);window.print();setTimeout(done,1500);
}
/* 區塊轉 PNG（foreignObject；失敗時改輸出 SVG） */
async function elToPNG(el,name){
const w=Math.ceil(Math.max(el.scrollWidth,el.getBoundingClientRect().width)), h=Math.ceil(el.scrollHeight);
const clone=el.cloneNode(true);
clone.querySelectorAll('.xwrap,.xslot').forEach(x=>x.remove());
Object.assign(clone.style,{margin:'0',width:w+'px',maxHeight:'none',overflow:'visible'});
if(getComputedStyle(el).position==='sticky') clone.style.position='static';
const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n').replace(/:root/g,':root,.xroot').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const vars=(ROOT.getAttribute('style')||'').replace(/"/g,"'");
const theme=ROOT.dataset.theme||'';
const body=new XMLSerializer().serializeToString(clone);
const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" class="xroot" ${theme?`data-theme="${theme}"`:''} style="${vars};width:${w}px;height:${h}px;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:calc(14px*var(--fs))"><style>${css}</style>${body}</div></foreignObject></svg>`;
const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
try{
const img=new Image(); img.src=url; await img.decode();
const k=2, cv=document.createElement('canvas'); cv.width=w*k; cv.height=h*k;
const ctx=cv.getContext('2d'); ctx.scale(k,k); ctx.drawImage(img,0,0);
const blob=await new Promise((res,rej)=>{try{cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png')}catch(e){rej(e)}});
download(name+'.png',blob);
}catch(e){ download(name+'.svg',svgStr,'image/svg+xml'); toast('此瀏覽器限制 PNG 轉換，已改輸出 SVG（可用瀏覽器開啟）'); }
}
/* 循環圖 SVG（將 CSS 變數解析為實際色彩） */
function flowSVGString(){
const cs=getComputedStyle(ROOT); const vars=['--bg','--node','--line2','--edge-t','--chord-t','--text'].map(v=>`${v}:${cs.getPropertyValue(v).trim()}`).join(';');
const c=$('#flow').cloneNode(true); const vb=c.getAttribute('viewBox').split(' ').map(Number);
c.setAttribute('xmlns','http://www.w3.org/2000/svg'); c.setAttribute('width',vb[2]*1.4); c.setAttribute('height',vb[3]*1.4);
c.setAttribute('style',vars+";font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif");
c.querySelectorAll('animateMotion').forEach(a=>a.parentNode.remove());
const bg=document.createElementNS(NS,'rect'); Object.entries({x:vb[0],y:vb[1],width:vb[2],height:vb[3],style:'fill:var(--bg)'}).forEach(([k,v])=>bg.setAttribute(k,v)); c.insertBefore(bg,c.firstChild);
const t=document.createElementNS(NS,'text'); Object.entries({x:vb[0]+16,y:vb[1]+28,'font-size':18,'font-weight':700,style:'fill:var(--text)'}).forEach(([k,v])=>t.setAttribute(k,v)); t.textContent=M.entity+' 資金循環｜'+LOOPS[curLoop].title; c.appendChild(t);
return {str:new XMLSerializer().serializeToString(c),w:vb[2]*1.4,h:vb[3]*1.4};
}
async function flowPNG(){
const {str,w,h}=flowSVGString(); const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str); await img.decode();
const cv=document.createElement('canvas'); cv.width=w*2; cv.height=h*2; const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.drawImage(img,0,0);
cv.toBlob(b=>download(`${PFX}_資金循環_${LOOPS[curLoop].id}_${STAMP}.png`,b),'image/png');
}
